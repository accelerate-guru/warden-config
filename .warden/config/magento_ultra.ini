; ============================================================
; Accelerate Guru — Warden dev config
; Pre-configured for Warden. Edit only if you need to customise.
; ============================================================

[license]
; Use "dev" for local development (no license key required).
key = dev
store_view_id = all

; ============================================================
; UPSTREAM
; Without Varnish: accelerate-guru → nginx → php-fpm
; With Varnish:    accelerate-guru → varnish → nginx → php-fpm
; ============================================================
[server]
http_port  = 80
https_port = 443
; Magento root — needed so AG can auto-detect session Redis from env.php.
magento_dir    = /var/www/html
; Set to "nginx" (no Varnish) or "varnish" (WARDEN_VARNISH=1). Both listen on :80.
upstream_addr  = nginx
upstream_port  = 80
workers        = 0

[tls_ssl]
upstream_tls = false
; Traefik handles external TLS. self_signed is fine inside the Docker network.
ssl_mode      = self_signed
ssl_cache_dir = /var/cache/accelerate-guru/ssl
; Add your Warden domains so the self-signed cert covers them (required for /stats-ag).
; Example: ssl_extra_sans = app.mystore.test,mystore.test
ssl_extra_sans =

; ============================================================
; CACHE — DragonflyDB (started by warden-env.yml, port 6380)
; Magento's own Redis runs on port 6379 and is untouched.
; ============================================================
[cache]
enabled        = true
redis_host     = dragonfly
redis_port     = 6379
redis_password =
redis_db       = 0
; Shorter TTL in dev — raise in staging/prod.
cache_ttl_fallback     = 3600
cache_exclude_params   = gclid,utm_source,utm_medium,utm_campaign,utm_content,utm_term,fbclid
cache_exclude_paths    = /customer/,/checkout/,/wishlist/,/sales/,/newsletter/,/paypal/,/multishipping/,/admin,/loginascustomer/
graphql_cache          = false
static_asset_cache     = true
static_asset_cache_ttl = 3600
vary_cookies           = esw-currency,esw-location,store
customer_cache_ttl_secs            = 30
customer_data_endpoint_ttl_secs    = 10
customer_data_endpoints            = /customer/section/load/

; ============================================================
; AUTH DETECTION
; mode=auto reads env.php → finds Magento's session Redis automatically.
; No manual config needed.
; ============================================================
[auth_detection]
mode                   = auto
session_redis_host     =
session_redis_port     = 6379
session_redis_db       = 0
session_redis_password =
session_state_lru_size        = 1000
session_state_lru_ttl_secs    = 5
enable_per_customer_cache           = true
enable_cache_poisoning_sanity_check = true
session_tracker_ttl_secs            = 3600
session_tracker_dragonfly_enabled   = true
cold_start_assume_logged_if_vary    = true

; ============================================================
; SECURITY
; WAF and bot detection are off in dev to avoid blocking local tooling.
; ============================================================
[security]
auth_mode            = 0
enable_smart_waf     = false
disable_waf_on_admin = true
admin_path           = /admin
block_threshold      = 3
log_file             = /var/log/accelerate-guru/waf.log
enable_bot_detection = false
bypass_ips           =

[stats]
enabled     = true
; Docker bridge networks (172.x.x.x, 10.x.x.x) so you can reach /stats-ag from your browser.
allowed_ips = 127.0.0.1,172.0.0.0/8,10.0.0.0/8

; ============================================================
; INTEGRATIONS (disabled in dev — enable in staging/prod)
; ============================================================
[magento_redis]
; Read-only access to Magento's FPC Redis for tag-based invalidation.
enabled  = false
host     = redis
port     = 6379
db       = 1

[mysql_proxy]
; Point Magento env.php to listen_port to enable SQL-level cache invalidation.
enabled      = false
listen_port  = 3307
mysql_host   = db
mysql_port   = 3306

; ============================================================
; NETWORK & OPTIMISATIONS
; ============================================================
[network]
compression_priority  = zstd,br,gzip
static_cache_max_age  = 31536000
page_cache_control    = public, max-age=5, stale-while-revalidate=60
robots_txt_fallback   = true
learn_early_hints     = true

[service_worker]
enabled = false

[optimization_global]
enabled      = true
html_rewrite = true

[optimization_html]
enable_dom_flattening = true
max_dom_depth         = 20
; noindex=true prevents search engines from indexing your local dev domain.
add_nofollow          = true
inject_preconnect     = true
enforce_accessibility = true
fix_aria_roles        = true
auto_meta_description = true
remove_unload_handlers = true
esi_enabled           = false
luma_block_cache      = false
theme_family          = auto
content_visibility    = true

[optimization_assets]
enable_tree_shaking   = true
enable_critical_css   = false
force_defer_js        = true
delay_third_party_js  = false
css_minify            = true
inject_script_preloads = true

[optimization_fonts]
enabled = false

[optimization_speculation]
; Disabled in dev — Chrome ignores speculation rules on self-signed/local domains.
enabled = false

[optimization_images]
image_avif            = true
avif_quality          = 65
; avif_speed 6 = faster encode in dev. Use 1 (best compression) in prod.
avif_speed            = 6
avif_max_size         = 10485760
image_cache_dir       = /var/cache/accelerate-guru/images
avif_on_the_fly       = false
image_revalidation_interval = 300
inject_asset_dimensions = true
preload_lcp_image     = true
optimize_above_fold   = true
above_fold_count      = 3
responsive_images     = true

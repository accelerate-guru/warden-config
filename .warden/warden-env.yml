services:
  nginx:
    labels:
      traefik.enable: "false"

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    ulimits:
      memlock: -1
    command: >
      --logtostderr
      --cache_mode=true
      --maxmemory=512mb
      --proactor_threads=2
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "echo PING | nc -w1 127.0.0.1 6379 | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    networks:
      default:
        aliases:
          - db
          - db-upstream

  accelerate-guru:
    image: ghcr.io/accelerate-guru/edge:latest
    restart: unless-stopped
    depends_on:
      dragonfly:
        condition: service_healthy
      nginx:
        condition: service_started
      db:
        condition: service_started
    networks:
      default:
        aliases:
          - db
    volumes:
      - "./.warden/config/magento_ultra.ini:/etc/accelerate-guru/magento_ultra.ini:ro"
      - "./app/etc:/var/www/html/app/etc:ro"
      - "ag-state:/var/lib/accelerate-guru"
    tmpfs:
      - /var/cache/accelerate-guru:uid=65532,gid=65532
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${WARDEN_ENV_NAME}-ag.rule=Host(`${TRAEFIK_MAGENTO_SUBDOMAIN:-app}.${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.${WARDEN_ENV_NAME}-ag.tls=true"
      - "traefik.http.routers.${WARDEN_ENV_NAME}-ag.entrypoints=https"
      - "traefik.http.routers.${WARDEN_ENV_NAME}-ag.priority=100"
      - "traefik.http.services.${WARDEN_ENV_NAME}-ag.loadbalancer.server.port=80"

volumes:
  dragonfly-data:
  ag-state:
